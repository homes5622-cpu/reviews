<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도서 리뷰 프롬프트 빌더 v2</title>
<style>
:root{
  --bg:#FAF9F6; --ink:#2B2B2B; --point:#1F4D3C;
  --line:#E3E0D8; --muted:#8A857B; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,'Pretendard','Apple SD Gothic Neo',sans-serif;line-height:1.6}
header{background:var(--point);color:#fff;padding:22px 20px}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:6px 0 0;font-size:13px;opacity:.85}
.wrap{display:grid;grid-template-columns:1fr;gap:18px;padding:18px;max-width:1400px;margin:0 auto}
@media(min-width:1000px){.wrap{grid-template-columns:1.05fr .95fr;align-items:start}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h2{margin:0 0 12px;font-size:15px;border-left:3px solid var(--point);padding-left:9px}
details{border:1px solid var(--line);border-radius:9px;margin-bottom:9px;background:#fff}
details[open]{box-shadow:0 1px 4px rgba(0,0,0,.04)}
summary{cursor:pointer;padding:10px 12px;font-size:14px;font-weight:600;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--muted);font-size:11px}
details[open] summary::after{content:"▴"}
.count{font-size:11px;font-weight:500;color:#fff;background:var(--point);
  border-radius:20px;padding:1px 8px;min-width:20px;text-align:center}
.count.zero{background:#CFCBC2;color:#fff}
.body{padding:0 12px 12px}
.hint{font-size:11.5px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:20px;padding:5px 11px;font-size:12.5px;cursor:pointer;
  font-family:inherit;transition:.12s}
.chip:hover{border-color:var(--point)}
.chip.on{background:var(--point);color:#fff;border-color:var(--point)}
.chip .sw{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:5px;vertical-align:-1px;border:1px solid rgba(0,0,0,.15)}
label.f{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=date],textarea,select{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
  font-family:inherit;font-size:13px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:52px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--point);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:11px}
.btn{border:1px solid var(--point);background:#fff;color:var(--point);
  border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit}
.btn.pri{background:var(--point);color:#fff}
.btn.gh{border-color:var(--line);color:var(--muted)}
.btn:active{transform:translateY(1px)}
pre#out{background:#14161A;color:#E8E6E1;border-radius:9px;padding:14px;
  font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-word;
  max-height:70vh;overflow:auto;margin:0;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.stat{font-size:11.5px;color:var(--muted);margin:8px 2px 0;display:flex;
  justify-content:space-between;flex-wrap:wrap;gap:6px}
.sticky{position:sticky;top:18px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:var(--point);color:#fff;padding:10px 20px;border-radius:24px;
  font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.over{color:#9B1B30;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>도서 리뷰 HTML 프롬프트 빌더 <span style="opacity:.7;font-size:13px">v2</span></h1>
  <p>단어를 클릭해 고르면 오른쪽에 프롬프트가 실시간으로 조립됩니다. 완성되면 복사해서 AI에게 붙여넣으세요.</p>
</header>

<div class="wrap">
  <!-- ========== 왼쪽: 입력 ========== -->
  <div>
    <div class="panel" style="margin-bottom:18px">
      <h2>1. 도서 기본 정보</h2>
      <div class="grid2">
        <div><label class="f" for="t">제목</label><input type="text" id="t" data-k="title" placeholder="사피엔스"></div>
        <div><label class="f" for="a">저자</label><input type="text" id="a" data-k="author" placeholder="유발 하라리"></div>
        <div><label class="f" for="p">출판사</label><input type="text" id="p" data-k="pub" placeholder="김영사"></div>
        <div><label class="f" for="y">출간연도</label><input type="text" id="y" data-k="year" placeholder="2015"></div>
      </div>
      <label class="f" for="q">인상 깊은 구절 (줄바꿈으로 여러 개)</label>
      <textarea id="q" data-k="quote" placeholder="우리는 밀을 길들인 것이 아니라 밀이 우리를 길들였다."></textarea>
      <div class="grid2">
        <div><label class="f" for="r">내 평점 (5점 만점)</label>
          <select id="r" data-k="rate">
            <option value="">선택</option>
            <option>5.0</option><option>4.5</option><option>4.0</option><option>3.5</option>
            <option>3.0</option><option>2.5</option><option>2.0</option><option>1.5</option><option>1.0</option>
          </select></div>
        <div><label class="f" for="w">작성자</label><input type="text" id="w" data-k="writer" placeholder="홍길동"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:18px">
      <h2>2. 서지·리뷰 단어 선택</h2>
      <div id="bankA"></div>
    </div>

    <div class="panel" style="margin-bottom:18px">
      <h2>3. 나의 감상 (1인칭)</h2>
      <p class="hint">칩은 '시작 단어'로 들어갑니다. 아래 칸에 직접 쓰면 그 내용이 우선 사용돼요. 비우면 해당 줄은 프롬프트에서 제외됩니다.</p>
      <div id="bankB"></div>
      <label class="f" for="fw">직접 쓰는 자유 감상 (선택)</label>
      <textarea id="fw" data-k="free" rows="3" placeholder="책을 덮고 나서 든 생각을 자유롭게..."></textarea>
    </div>

    <div class="panel">
      <h2>4. 디자인 옵션</h2>
      <div id="bankC"></div>
      <div class="grid2" style="margin-top:10px">
        <div><label class="f" for="len">객관 서평 분량</label>
          <select id="len" data-k="len">
            <option>600~900자</option><option>400~600자</option>
            <option>900~1200자</option><option>1200자 이상</option>
          </select></div>
        <div><label class="f" for="tone">감상 섹션 말투</label>
          <select id="tone" data-k="tone">
            <option>존댓말 평문</option><option>반말 일기체</option><option>구어체 솔직한 톤</option>
          </select></div>
      </div>
      <label class="f"><input type="checkbox" id="opt_ls" checked style="width:auto"> 8번 입력폼 localStorage 자동저장 포함</label>
      <label class="f"><input type="checkbox" id="opt_txt" style="width:auto"> 감상 .txt 다운로드 버튼 추가</label>
      <label class="f"><input type="checkbox" id="opt_anim" style="width:auto"> 평가 게이지 애니메이션 추가</label>
      <label class="f"><input type="checkbox" id="opt_dark" style="width:auto"> 다크모드 토글 추가</label>
    </div>
  </div>

  <!-- ========== 오른쪽: 출력 ========== -->
  <div class="panel sticky">
    <h2>완성된 프롬프트</h2>
    <div class="bar">
      <button class="btn pri" id="copy">복사하기</button>
      <button class="btn" id="dl">.txt 저장</button>
      <button class="btn" id="rand">랜덤 채우기</button>
      <button class="btn" id="sample">예시(사피엔스)</button>
      <button class="btn gh" id="reset">전체 초기화</button>
    </div>
    <pre id="out"></pre>
    <div class="stat">
      <span id="cnt"></span>
      <span id="warn"></span>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ---------- 단어 뱅크 ---------- */
const S = (s)=>s.split('·').map(v=>v.trim());
const BANK_A = [
 {k:'genre', t:'① 장르', max:1, items:S('인문·역사|사회과학|경제·경영|자기계발|심리학|철학|과학교양|기술·IT|현대문학|고전문학|에세이|회고록·자서전|시집|추리·미스터리|SF·사변소설|판타지|로맨스|스릴러|그래픽노블|르포·논픽션'.replace(/·/g,'\u00B7')).join('').split('|')},
 {k:'topic', t:'② 핵심 주제 키워드', max:5, items:['정체성','성장서사','상실과 애도','고독','욕망','트라우마','계급','불평등','권력관계','공동체','세대갈등','도시화','자유의지','윤리적 딜레마','시간의 비선형성','기억의 왜곡','허구의 힘','우연과 필연','자동화','데이터 감시','기후위기','팬데믹 이후','노동의 변화','포스트휴먼']},
 {k:'persona', t:'③ 추천 대상', max:2, items:['인문서 입문 독자','깊이 있는 논증을 즐기는 독자','출퇴근 짧은 독서를 원하는 사람','완독 경험이 필요한 독서 초보','고전이 어렵게 느껴지는 독자','독서모임 발제자','서평 블로거','수험생·대학 신입생','팀을 처음 맡은 리더','상실을 겪고 있는 사람','커리어 전환을 고민 중인 30대','번아웃을 겪는 직장인','사춘기 자녀를 둔 부모','글쓰기를 배우는 사람','창업·사이드프로젝트 준비자','데이터·AI 실무자','교사·강사','은퇴 후 독서를 시작한 분','마케터·기획자','밤에 조용히 읽을 책을 찾는 사람']},
 {k:'oneline', t:'④ 한 줄 총평', max:1, items:['익숙한 일상을 낯설게 만드는 책','읽고 나면 세계관이 한 칸 넓어진다','불편하지만 반드시 필요한 질문','조용히, 그러나 오래 남는 여운','첫 50페이지만 버티면 끝까지 간다','설득이 아니라 설계에 가까운 글','머리보다 체온이 먼저 반응하는 책','정답 대신 좋은 질문을 쥐어준다','한 문장도 낭비가 없다','입문서의 탈을 쓴 본격서','생각의 근육을 쓰게 만드는 책','밑줄이 멈추지 않는다','다 읽고 나서가 진짜 시작','지식보다 태도를 남긴다','서늘하게 정확한 문장들','가볍게 집어 무겁게 내려놓는다','재독할수록 다른 책이 된다','쉽게 읽히지만 쉽게 잊히지 않는다','위로보다 직면을 택한 책','책장 맨 앞줄에 둘 한 권']},
 {k:'pros', t:'⑤ 좋았던 점', max:3, items:['치밀한 논증','간결한 문체','독창적 관점','친절한 설명','유려한 번역','명확한 구조','적절한 호흡','시의성 있는 주제','솔직한 자기고백','유머의 적절한 배치','풍부한 사례','탄탄한 자료 조사','균형 잡힌 시각','설득력 있는 비유','인물의 입체성','몰입도 높은 전개','여운 있는 결말','실천 가능한 제안','정교한 복선','깔끔한 편집·도판']},
 {k:'cons', t:'⑥ 아쉬운 점', max:2, items:['중반부 전개가 다소 늘어진다','결론이 예상 범위를 벗어나지 않는다','사례가 서구권에 편중돼 있다','용어 설명이 불친절한 구간이 있다','주장에 비해 근거가 얇은 장이 있다','번역투 문장이 간간이 걸린다','반복되는 메시지가 피로감을 준다','인물의 동기 설명이 부족하다','통계 출처 표기가 아쉽다','챕터 간 밀도 편차가 크다','입문자에겐 진입장벽이 있다','기대했던 실천 지침이 적다','분량 대비 정보 밀도가 낮다','결말의 수습이 급하다','반대 입장에 대한 검토가 적다','도표가 본문과 잘 맞물리지 않는다','제목이 내용을 과장한다','시의성이 빠르게 바랠 소지가 있다','감정 묘사가 다소 관습적이다','색인·참고문헌이 부실하다']},
 {k:'metric', t:'⑦ 평가 지표 (4개)', max:4, items:['가독성','깊이','몰입도','재독의향','독창성','정보밀도','실용성','구성력','문장력','설득력','감정이입','시의성','객관성','번역품질','입문친화도','완독난이도','여운','편집디자인','자료신뢰도','추천지수']}
];
const BANK_B = [
 {k:'why', t:'⑧ 읽게 된 계기', max:1, free:'why_x', items:S('추천받아서·제목에 끌려·서점에서 우연히·저자의 전작이 좋아서·업무 과제 때문에·독서모임 선정도서·베스트셀러라서·영화 원작이라·SNS 인용문을 보고·선물받아서·비슷한 고민 중이라·반박하고 싶어서·오래 묵혀둔 책이라·서평이 인상 깊어서·전공 보충용·면접 준비·번역본이 새로 나와서·저자 강연을 듣고·밑줄 사진을 보고·그냥 쉬고 싶어서')},
 {k:'when', t:'⑨ 읽은 시기/상황', max:1, free:'when_x', items:S('이직 준비 공백기·출퇴근 지하철·자기 전 30분·주말 카페·병원 대기실·여행 중·번아웃 회복기·프로젝트 마감 직후·휴직 기간·시험 끝난 날·이사 직후·새해 첫 주·장마철·퇴사 고민 중·육아 틈새 시간·야근 후·독서모임 전날 벼락치기·긴 연휴·입원 중·환절기 불면의 밤')},
 {k:'agree', t:'⑩ 공감 반응', max:2, free:'agree_x', items:S('가슴이 내려앉았다·밑줄을 세 번 그었다·책을 덮고 한참 앉아 있었다·내 얘기 같았다·소름이 돋았다·변명이 사라졌다·눈물이 났다·웃다가 멈췄다·메모장에 옮겨 적었다·친구에게 사진 찍어 보냈다·다시 앞으로 돌아가 읽었다·숨이 트였다·오래 묵은 죄책감이 풀렸다·그 장면이 계속 떠올랐다·안심이 됐다·부끄러웠다·답을 받은 기분·지금 읽길 잘했다·마음이 서늘했다·조용히 고개를 끄덕였다')},

/* ---------- 렌더 ---------- */
function render(bank, mount){
  const host=document.getElementById(mount);
  bank.forEach(g=>{
    const d=document.createElement('details');
    d.innerHTML=`<summary><span>${g.t}</span><span class="count zero" data-c="${g.k}">0/${g.max}</span></summary>
      <div class="body"><p class="hint">최대 ${g.max}개 · 다시 누르면 해제</p>
      <div class="chips" data-g="${g.k}"></div>
      ${g.free?`<label class="f">직접 입력 (우선 적용)</label><input type="text" data-k="${g.free}" placeholder="직접 쓰면 위 선택 대신 이 문장이 들어갑니다">`:''}
      </div>`;
    host.appendChild(d);
    const box=d.querySelector('.chips');
    g.items.forEach(it=>{
      const b=document.createElement('button');
      b.className='chip'; b.type='button';
      if(g.k==='color'){const hex=it.split(' ')[1];b.innerHTML=`<span class="sw" style="background:${hex}"></span>${it.split(' ')[0]}`;}
      else b.textContent=it;
      b.onclick=()=>{
        const i=sel[g.k].indexOf(it);
        if(i>-1) sel[g.k].splice(i,1);
        else{ if(sel[g.k].length>=g.max) sel[g.k].shift(); sel[g.k].push(it); }
        paint(g); build();
      };
      b.dataset.v=it; box.appendChild(b);
    });
  });
}
function paint(g){
  document.querySelectorAll(`[data-g="${g.k}"] .chip`).forEach(c=>
    c.classList.toggle('on', sel[g.k].includes(c.dataset.v)));
  const c=document.querySelector(`[data-c="${g.k}"]`);
  c.textContent=`${sel[g.k].length}/${g.max}`;
  c.classList.toggle('zero', sel[g.k].length===0);
}
render(BANK_A,'bankA'); render(BANK_B,'bankB'); render(BANK_C,'bankC');

/* ---------- 저장/복원 ---------- */
const KEY='promptbuilder:v2';
function save(){try{const f={};document.querySelectorAll('[data-k]').forEach(e=>f[e.dataset.k]=e.value);
  ['opt_ls','opt_txt','opt_anim','opt_dark'].forEach(i=>f[i]=document.getElementById(i).checked);
  localStorage.setItem(KEY,JSON.stringify({sel,f}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return;
  Object.keys(d.sel||{}).forEach(k=>{if(sel[k])sel[k]=d.sel[k]});
  Object.entries(d.f||{}).forEach(([k,val])=>{
    if(k.startsWith('opt_')){const el=document.getElementById(k);if(el)el.checked=val;}
    else{const el=document.querySelector(`[data-k="${k}"]`);if(el)el.value=val;}});
  ALL.forEach(paint);}catch(e){}}

function toast(m){const t=document.getElementById('toast');t.textContent=m;
  t.classList.add('on');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('on'),1600);}
document.getElementById('copy').onclick=async()=>{
  const txt=document.getElementById('out').textContent;
  try{await navigator.clipboard.writeText(txt);toast('프롬프트를 복사했습니다');}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);
    ta.select();document.execCommand('copy');ta.remove();toast('복사했습니다');}};
document.getElementById('dl').onclick=()=>{
  const v=V();const name=(v.title||'book-review')+'_prompt.txt';
  const b=new Blob([document.getElementById('out').textContent],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();
  URL.revokeObjectURL(a.href);toast('저장했습니다');};
document.getElementById('rand').onclick=()=>{
  ALL.forEach(g=>{const n=Math.max(1,Math.min(g.max,g.max));const pool=[...g.items];
    sel[g.k]=[];for(let i=0;i<n;i++){sel[g.k].push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);}
    paint(g);});
  build();toast('랜덤으로 채웠습니다');};
document.getElementById('sample').onclick=()=>{
  const set=(k,val)=>{const e=document.querySelector(`[data-k="${k}"]`);if(e)e.value=val;};
  set('title','사피엔스');set('author','유발 하라리');set('pub','김영사');set('year','2015');
  set('quote','우리는 밀을 길들인 것이 아니라 밀이 우리를 길들였다.');set('rate','4.5');
  set('why_x',"팀에서 '왜 이 제도가 유지되는가'를 설명하지 못해 답답했다");
  set('when_x','이직 준비로 공백기였던 2026년 봄');
  set('agree_x',"돈·국가·회사가 모두 '공유된 허구'라는 대목에서 조직도가 다르게 보였다");
  set('doubt_x','수렵채집민이 더 행복했다는 주장은 근거가 얇게 느껴졌다');
  set('act_x','규칙을 볼 때 "누가 만든 허구인가"를 먼저 묻기');
  set('ask_x','허구임을 알고도 협력을 유지할 수 있을까');
  set('self_x','당연하던 것들이 전부 질문으로 바뀐 봄');
  sel.genre=['인문·역사'];sel.topic=['허구의 힘','권력관계','공동체'];
  sel.persona=['인문서 입문 독자'];sel.oneline=['익숙한 일상을 낯설게 만드는 책'];
  sel.pros=['독창적 관점','풍부한 사례','설득력 있는 비유'];
  sel.cons=['주장에 비해 근거가 얇은 장이 있다','사례가 서구권에 편중돼 있다'];
  sel.metric=['가독성','깊이','몰입도','재독의향'];
  sel.color=['딥그린 #1F4D3C'];sel.dtone=['매거진형'];sel.alias=['나의 기록'];
  sel.check=['이 주제를 처음 알아보려는 분','독서모임 발제를 준비하는 분','생각을 글로 남기고 싶은 분'];
  ALL.forEach(paint);build();toast('예시를 불러왔습니다');};
document.getElementById('reset').onclick=()=>{
  if(!confirm('모든 입력과 선택을 초기화할까요?'))return;
  ALL.forEach(g=>{sel[g.k]=[];paint(g)});
  document.querySelectorAll('[data-k]').forEach(e=>e.value='');
  localStorage.removeItem(KEY);build();toast('초기화했습니다');};

document.addEventListener('input',e=>{if(e.target.matches('[data-k],input[type=checkbox]'))build();});
load(); build();
</script>
